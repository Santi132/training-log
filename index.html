<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Training Log</title>
<meta name="description" content="Personal full-body training log">
<meta name="theme-color" content="#f2f4f6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1418" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Training">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" crossorigin href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap">
<script>
// Apply the saved theme before first paint so non-default themes don't flash. Mirrors applyTheme().
try { const p = JSON.parse(localStorage.getItem('prefs') || '{}') || {}, r = document.documentElement;
  if (['iron', 'hv', 'term', 'amber', 'phos', 'frost', 'ember', 'synth'].includes(p.skin)) r.dataset.skin = p.skin;
  if (['term', 'amber', 'phos', 'frost', 'ember', 'synth'].includes(p.skin)) r.dataset.mono = '';
  r.dataset.theme = p.mode === 'light' || p.mode === 'dark' ? p.mode : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; } catch (e) {}
</script>
<style>
/* ---------- Themes. Slate and teal is the default and follows light/dark. ---------- */
:root{
  --bg:#f2f4f6;--surf:#fff;--surf2:#e9edf0;--ink:#16202a;--mut:#53606c;--line:#d5dce2;--line2:#7b8893;
  --acc:#0e5e5c;--on-acc:#fff;--warn:#a8321f;--warn-bg:#fbebe7;
  --ca:#0e7c7b;--cb:#2f6fb3;--cc:#b4561a;--cd:#7a52b3;--on-c:#fff;
  --r:10px;--tap:44px;--tabh:58px;
  --fh:"Barlow Condensed","Arial Narrow","Roboto Condensed",system-ui,sans-serif;
  --fb:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --fm:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#0f1418;--surf:#161d23;--surf2:#1e272e;--ink:#e3e9ed;--mut:#97a4ae;--line:#28333c;--line2:#6b7884;
  --acc:#3fb2ab;--on-acc:#071413;--warn:#ff9b8b;--warn-bg:#3a1f1b;
  --ca:#3bb3ad;--cb:#6fa3e0;--cc:#e58a4a;--cd:#a68ae0;--on-c:#0b1115;color-scheme:dark}}
:root[data-theme=dark]{
  --bg:#0f1418;--surf:#161d23;--surf2:#1e272e;--ink:#e3e9ed;--mut:#97a4ae;--line:#28333c;--line2:#6b7884;
  --acc:#3fb2ab;--on-acc:#071413;--warn:#ff9b8b;--warn-bg:#3a1f1b;
  --ca:#3bb3ad;--cb:#6fa3e0;--cc:#e58a4a;--cd:#a68ae0;--on-c:#0b1115;color-scheme:dark}
/* Other themes: generated palettes, dark by default, light under [data-theme=light]. All pass WCAG AA
   (text colours on --surf/--surf2/--bg, --on-acc on --acc, --on-c on session colours). */
:root[data-skin=iron]{--bg:#141516;--surf:#1c1e20;--surf2:#25282a;--ink:#ece9e2;--mut:#a29f97;--line:#2e3133;--line2:#706d66;--acc:#ece9e2;--on-acc:#141516;--warn:#ff9b8b;--warn-bg:#3a1f1b;--ca:#7fb8ad;--cb:#8fa9d6;--cc:#d9925f;--cd:#b39ad9;--on-c:#141516;color-scheme:dark}
:root[data-skin=iron][data-theme=light]{--bg:#eeebe4;--surf:#f8f6f1;--surf2:#e4e0d7;--ink:#1c1e20;--mut:#5a5852;--line:#d5d0c5;--line2:#85817a;--acc:#1c1e20;--on-acc:#f8f6f1;--warn:#a8321f;--warn-bg:#f6e3dd;--ca:#2b6a5e;--cb:#3b5b94;--cc:#94491a;--cd:#6a4c96;--on-c:#ffffff;color-scheme:light}
:root[data-skin=hv]{--bg:#000000;--surf:#0e0e0e;--surf2:#1a1a1a;--ink:#ffffff;--mut:#c4c4c4;--line:#2c2c2c;--line2:#8a8a8a;--acc:#d4ff3a;--on-acc:#000000;--warn:#ff8a7a;--warn-bg:#2a0f0b;--ca:#3ef0c8;--cb:#5cb8ff;--cc:#ff9f3a;--cd:#c49bff;--on-c:#000000;color-scheme:dark}
:root[data-skin=hv][data-theme=light]{--bg:#ffffff;--surf:#ffffff;--surf2:#efefef;--ink:#000000;--mut:#3a3a3a;--line:#cfcfcf;--line2:#6b6b6b;--acc:#1d6400;--on-acc:#ffffff;--warn:#a8001c;--warn-bg:#fde7e9;--ca:#006b5f;--cb:#0050c0;--cc:#a84300;--cd:#6127b5;--on-c:#ffffff;color-scheme:light}
:root[data-skin=term]{--bg:#0c0e11;--surf:#121519;--surf2:#191d22;--ink:#e4e4df;--mut:#9aa0a8;--line:#252a31;--line2:#5d646d;--acc:#ff8f5a;--on-acc:#120c08;--warn:#ff8a80;--warn-bg:#331816;--ca:#4fd1c5;--cb:#7aa2f7;--cc:#e6c86e;--cd:#bb9af7;--on-c:#0c0e11;color-scheme:dark}
:root[data-skin=term][data-theme=light]{--bg:#f4f1ea;--surf:#fbf9f4;--surf2:#ece8de;--ink:#1c1b18;--mut:#5f5b52;--line:#d9d3c6;--line2:#8d877a;--acc:#a8380a;--on-acc:#ffffff;--warn:#b42318;--warn-bg:#fbe9e6;--ca:#0d6b64;--cb:#1d4ed8;--cc:#854d0e;--cd:#7e22ce;--on-c:#ffffff;color-scheme:light}
:root[data-skin=amber]{--bg:#0d0b07;--surf:#15120c;--surf2:#1d1910;--ink:#f2e3c6;--mut:#b0a084;--line:#2b2518;--line2:#6b5f48;--acc:#ffb000;--on-acc:#15120c;--warn:#ff8a7a;--warn-bg:#3a1a12;--ca:#6fd3b0;--cb:#8ab4ff;--cc:#ff7a59;--cd:#d79bff;--on-c:#0d0b07;color-scheme:dark}
:root[data-skin=amber][data-theme=light]{--bg:#f7f1e3;--surf:#fdf9ef;--surf2:#efe6d0;--ink:#2a2010;--mut:#66553a;--line:#e0d4b8;--line2:#9a8a68;--acc:#8f5200;--on-acc:#ffffff;--warn:#a8321f;--warn-bg:#f8e3da;--ca:#0f6e5a;--cb:#2b5cb8;--cc:#ad3818;--cd:#7d3cb5;--on-c:#ffffff;color-scheme:light}
:root[data-skin=phos]{--bg:#070c09;--surf:#0d1410;--surf2:#131c16;--ink:#d6f5dc;--mut:#8fb39a;--line:#1e2a22;--line2:#4f6b58;--acc:#39ff88;--on-acc:#07140c;--warn:#ff8a80;--warn-bg:#33161a;--ca:#5fd7ff;--cb:#9d9dff;--cc:#ffb454;--cd:#ff7ab6;--on-c:#070c09;color-scheme:dark}
:root[data-skin=phos][data-theme=light]{--bg:#eef5ef;--surf:#f8fcf8;--surf2:#e2ece4;--ink:#0f2416;--mut:#45604e;--line:#cfe0d3;--line2:#7f9886;--acc:#0f7034;--on-acc:#ffffff;--warn:#b42318;--warn-bg:#fbe6e4;--ca:#0a6a84;--cb:#4747c0;--cc:#8f5400;--cd:#ac2d6b;--on-c:#ffffff;color-scheme:light}
:root[data-skin=frost]{--bg:#12161c;--surf:#181d25;--surf2:#1f2530;--ink:#e5e9f0;--mut:#a3adbd;--line:#2a313d;--line2:#5c6779;--acc:#88c0d0;--on-acc:#12161c;--warn:#f0a0a6;--warn-bg:#3a2226;--ca:#8fbcbb;--cb:#81a1c1;--cc:#d08770;--cd:#b48ead;--on-c:#12161c;color-scheme:dark}
:root[data-skin=frost][data-theme=light]{--bg:#eceff4;--surf:#f7f8fb;--surf2:#e5e9f0;--ink:#2e3440;--mut:#4c566a;--line:#d3d9e3;--line2:#7b8699;--acc:#346583;--on-acc:#ffffff;--warn:#a3333d;--warn-bg:#f6e1e3;--ca:#36706e;--cb:#476489;--cc:#9c4f2b;--cd:#7a5575;--on-c:#ffffff;color-scheme:light}
:root[data-skin=ember]{--bg:#1b1714;--surf:#221d19;--surf2:#2a241f;--ink:#ebdbb2;--mut:#a89984;--line:#3a322b;--line2:#6e6257;--acc:#fe8019;--on-acc:#1b1714;--warn:#fb7a6a;--warn-bg:#3c1f1a;--ca:#8ec07c;--cb:#83a598;--cc:#fabd2f;--cd:#d3869b;--on-c:#1b1714;color-scheme:dark}
:root[data-skin=ember][data-theme=light]{--bg:#fbf1c7;--surf:#fdf7dc;--surf2:#f2e5bc;--ink:#3c3836;--mut:#5f564f;--line:#e2d3a8;--line2:#928374;--acc:#a83802;--on-acc:#ffffff;--warn:#9d0006;--warn-bg:#f9e0d4;--ca:#386b4c;--cb:#076678;--cc:#855708;--cd:#8a3c6c;--on-c:#ffffff;color-scheme:light}
:root[data-skin=synth]{--bg:#0e0b16;--surf:#151122;--surf2:#1c172d;--ink:#ece6ff;--mut:#a69cc7;--line:#282140;--line2:#5e5385;--acc:#ff4fd8;--on-acc:#14091a;--warn:#ff8a8a;--warn-bg:#3a1420;--ca:#2de2e6;--cb:#7aa2ff;--cc:#ffd166;--cd:#b388ff;--on-c:#0e0b16;color-scheme:dark}
:root[data-skin=synth][data-theme=light]{--bg:#f4f0fb;--surf:#fbf9fe;--surf2:#ebe5f6;--ink:#1d1530;--mut:#574c74;--line:#ddd4ee;--line2:#8a7fa8;--acc:#b8168a;--on-acc:#ffffff;--warn:#b0233c;--warn-bg:#fbe4ea;--ca:#00717a;--cb:#3550c8;--cc:#7f5a00;--cd:#6a35c8;--on-c:#ffffff;color-scheme:light}
[data-skin=iron]{--r:5px}
[data-skin=iron] h1,[data-skin=iron] h2{letter-spacing:.07em}
/* High-vis: larger type, thicker set rings. */
[data-skin=hv] body{font-size:17px}
[data-skin=hv] .set{border-width:3px}
[data-skin=hv] .fx-n{font-size:36px}
[data-skin=hv] .btn.big{background:var(--acc);color:var(--on-acc)}
/* Terminal family (Terminal, Amber CRT, Phosphor, Frost, Ember, Synth): hairlines, square corners,
   monospace headings. Mono is wider than Barlow Condensed, so headings scale down. */
[data-mono]{--r:2px;--fh:var(--fm)}
[data-mono] h1{font-size:22px;letter-spacing:.04em}
[data-mono] h2{font-size:14px;font-weight:600;letter-spacing:.1em}
[data-mono] h3,[data-mono] .hrow b{font-size:16px}
[data-mono] .hero .ttl{font-size:28px}
[data-mono] .btn.block{font-size:16px}
[data-mono] .start .t{font-size:17px}
[data-mono] .big .t{font-size:20px}
[data-mono] .fx-n{font-size:23px}
[data-mono] .fx-rx,[data-mono] .ex-rx{font-size:15px}
[data-mono] .cal-head h2{font-size:17px}
[data-mono] .h-ph{font-size:clamp(22px,7vw,44px)}
[data-mono] .chip{border-radius:2px;font-size:16px}
[data-mono] .start,[data-mono] .big{box-shadow:none}

*,*::before,*::after{box-sizing:border-box}
html{background:var(--bg);-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.45 var(--fb);-webkit-tap-highlight-color:transparent;min-height:100vh;min-height:100dvh}
button,input,select{font:inherit;color:inherit;margin:0}
button{cursor:pointer;-webkit-user-select:none;user-select:none;touch-action:manipulation;background:none;border:0;padding:0}
button:disabled{opacity:.35;cursor:default}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap}
.cA{--c:var(--ca)}.cB{--c:var(--cb)}.cC{--c:var(--cc)}.cD{--c:var(--cd)}

main{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 12px) calc(env(safe-area-inset-right) + 12px) calc(env(safe-area-inset-bottom) + var(--tabh) + 24px) calc(env(safe-area-inset-left) + 12px)}
main.has-dock{padding-bottom:calc(env(safe-area-inset-bottom) + var(--tabh) + 96px)}
main.has-bigdock{padding-bottom:calc(env(safe-area-inset-bottom) + var(--tabh) + 150px)}
h1,h2,h3{font-family:var(--fh);margin:0;line-height:1.15}
h1{font-size:28px;font-weight:700;letter-spacing:.02em;text-transform:uppercase}
h2{font-size:19px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;margin-bottom:10px}
h3{font-size:19px;font-weight:600}
p{margin:0}
.mut{color:var(--mut)}.sm{font-size:14px}.xs{font-size:13px}
.card{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:0 0 12px}
.row{display:flex;align-items:center;gap:10px}
.wrap{overflow-wrap:anywhere}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:var(--tap);padding:0 16px;border-radius:var(--r);border:1px solid var(--line2);background:var(--surf);font-weight:600}
.btn.pri{background:var(--acc);color:var(--on-acc);border-color:transparent}
.btn.sess{background:var(--c);color:var(--on-c);border-color:transparent}
.btn.ghost{border-color:transparent;background:transparent;color:var(--mut)}
.btn.block{display:flex;width:100%;min-height:54px;font:700 20px/1 var(--fh);letter-spacing:.05em;text-transform:uppercase}
.ibtn{width:var(--tap);height:var(--tap);display:inline-grid;place-items:center;border-radius:var(--r);flex:none}
.ibtn.bord{border:1px solid var(--line2);font:700 22px/1 var(--fh)}
.ibtn svg{width:22px;height:22px}
svg.i{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* tabs, docks, toast */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;background:var(--surf);border-top:1px solid var(--line);padding:0 env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.tabs button{flex:1;max-width:150px;height:var(--tabh);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--mut);font:600 12px/1 var(--fb);letter-spacing:.06em;text-transform:uppercase}
.tabs button[aria-current=page]{color:var(--acc)}
.tabs svg{width:24px;height:24px}
.dock{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + var(--tabh));z-index:15;padding:12px calc(env(safe-area-inset-right) + 12px) 10px calc(env(safe-area-inset-left) + 12px);background:linear-gradient(to bottom,transparent,var(--bg) 30%)}
.start{width:100%;max-width:536px;margin:0 auto;min-height:60px;flex-direction:column;gap:2px;padding:6px 16px;box-shadow:0 4px 14px rgb(0 0 0 / .14)}
.start .t,.big .t{font:700 21px/1.05 var(--fh);letter-spacing:.05em;text-transform:uppercase}
.start .st,.big .st{font-size:13px;font-weight:500;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fdock{display:flex;gap:8px;max-width:536px;margin:0 auto}
.big{flex:1;min-width:0;min-height:104px;flex-direction:column;gap:4px;padding:8px 14px;box-shadow:0 4px 14px rgb(0 0 0 / .16)}
.big .t{font-size:26px}
.big .st{font-size:14px}
.undo{flex:none;width:64px;min-height:104px;padding:0;flex-direction:column;gap:2px;font-size:12px;text-transform:uppercase;letter-spacing:.05em}
.undo svg{width:24px;height:24px}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 12px);transform:translateX(-50%);z-index:30;max-width:calc(100vw - 32px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:var(--r);font-weight:600;font-size:15px;opacity:0;pointer-events:none}
.toast.show{opacity:1}

/* today */
.hero{border-color:var(--c);box-shadow:inset 4px 0 0 var(--c);padding-left:18px}
.lab{font:700 13px/1 var(--fb);letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
.hero .ttl{font:700 36px/1.05 var(--fh);text-transform:uppercase;margin:6px 0 2px}
.hero .ttl span{color:var(--c)}
.wk-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.wk-head h2{margin:0}
.wk-count b{font:700 26px/1 var(--fh)}
.notes{list-style:none;margin:0;padding:0}
/* Coach notes: coloured left rule + monospace micro-label, like calendar events. */
.notes li{display:flex;flex-direction:column;gap:3px;padding:2px 0 2px 11px;margin-top:10px;border-left:3px solid var(--line2);font-size:15px}
.notes li:first-child{margin-top:0}
.notes .nl{color:var(--mut)}
.n-up{border-left-color:var(--acc)!important}.n-up .nl{color:var(--acc)}
.n-warn{border-left-color:var(--warn)!important}.n-warn .nl{color:var(--warn)}
.cal{padding:10px}
.cal-head{display:flex;align-items:center;gap:2px;margin-bottom:4px}
.cal-head h2{flex:1;text-align:center;font-size:24px;font-weight:700;margin:0}
.today-btn{padding:0 12px;font-size:14px}
/* Hairline calendar grid: 1px gaps over a line-coloured background draw the rules. */
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);container-type:inline-size}
.grid>*{background:var(--surf)}
.strip{margin-top:10px}
.dow{text-align:center;color:var(--mut);padding:7px 0 6px}
.day{height:60px;display:flex;flex-direction:column;align-items:stretch;gap:6px;padding:5px 4px 4px;min-width:0;border-radius:0;text-align:left}
.day.we{background:var(--surf2)}
.strip .day{height:74px}
.day .dw{font:600 11px/1 var(--fm);color:var(--mut);text-transform:uppercase;letter-spacing:.06em;padding-left:2px}
.day .dn{font-size:13px;font-weight:600;line-height:20px;height:20px;min-width:20px;padding:0 3px;align-self:flex-start;text-align:center;border-radius:3px}
.day.past .dn{color:var(--mut)}
.day.today .dn{background:var(--acc);color:var(--on-acc)}
.day[aria-pressed=true]{box-shadow:inset 0 0 0 2px var(--ink)}
/* Event bar: coloured left rule + letter; tinted when logged, dashed rule when suggested. */
.ev{display:flex;align-items:center;gap:4px;min-width:0;height:20px;padding:0 4px;border-left:3px solid var(--c);font:700 12px/1 var(--fm);overflow:hidden;white-space:nowrap;border-radius:0 2px 2px 0}
.ev.log{background:color-mix(in srgb,var(--c) 22%,transparent)}
.ev.sug{border-left-style:dashed;color:var(--mut)}
.ev.sug b{color:var(--ink)}
.ev.live{box-shadow:inset 0 0 0 1px var(--c)}
.ev.none{visibility:hidden}
.ev .sn{display:none;font-weight:500;color:var(--mut);overflow:hidden;text-overflow:ellipsis}
.ev.log .sn{color:var(--ink)}
@container (min-width:470px){.ev .sn{display:inline}}
.badge{min-width:24px;height:24px;padding:0 4px;border-radius:6px;display:inline-grid;place-items:center;font:700 15px/1 var(--fh);letter-spacing:.02em;flex:none}
.badge.log{background:var(--c);color:var(--on-c)}
.badge.sug{border:1.5px dashed var(--c);color:var(--c)}
.badge.none{visibility:hidden}
.legend{display:flex;gap:16px;justify-content:center;align-items:center;min-height:var(--tap);margin-top:6px;color:var(--mut)}
.legend .ev{margin-right:6px;width:22px}
.legend span{display:inline-flex;align-items:center}
.legend .today-btn{font:600 14px/1 var(--fb);text-transform:none;letter-spacing:0}
.ag{list-style:none;margin:0;padding:0}
.ag li+li{border-top:1px solid var(--line)}
.ag-r{display:grid;grid-template-columns:92px minmax(0,1fr);gap:10px;align-items:start;width:100%;min-height:56px;padding:9px 0;text-align:left}
.ag-h{color:var(--mut);padding-top:3px;line-height:1.35}
.ag-h .mono{display:block;color:var(--ink);font-size:12px}
.ag li:first-child .ag-h>span:first-child{color:var(--acc)}
.ag-b{display:flex;flex-direction:column;min-width:0;border-left:3px solid var(--c);padding-left:10px}
.ag-b b{font-weight:600}
.ag-b .mut{overflow-wrap:anywhere}
.ag-st{font:600 11px/1 var(--fm);letter-spacing:.06em;text-transform:uppercase;color:var(--mut);margin-left:6px}
.ag-r.sel .ag-b{background:color-mix(in srgb,var(--c) 12%,transparent)}
.exlist{list-style:none;margin:10px 0 0;padding:0}
.exlist li{display:flex;gap:10px;justify-content:space-between;padding:7px 0;border-top:1px solid var(--line);font-size:15px}
.exlist li>span:first-child{min-width:0;overflow-wrap:anywhere}
.exlist .v{color:var(--mut);text-align:right;flex:none;max-width:50%;overflow-wrap:anywhere}
.ent+.ent{margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}

.wblk:first-of-type{margin-top:8px}

.chk .ds{color:var(--mut);font-size:14px;text-align:right;flex:none}
.ex.done{border-color:var(--c);box-shadow:inset 4px 0 0 var(--c)}
.ex-head{display:flex;align-items:baseline;gap:10px}

.tag{font:700 11px/1 var(--fb);text-transform:uppercase;letter-spacing:.06em;border:1px solid var(--line2);border-radius:4px;padding:3px 5px;color:var(--mut);align-self:center;flex:none}
.ex-note{font-size:14px;color:var(--mut);margin-top:6px}
.sets{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.set{width:var(--tap);height:var(--tap);border-radius:50%;border:2px solid var(--line2);font:700 18px/1 var(--fh);color:var(--mut)}

/* per-set rows: tick circle + value stepper */
.srows{display:flex;flex-direction:column;gap:4px;margin:12px 0}
.srow{display:flex;align-items:center;gap:10px;padding:3px 4px 3px 3px;border-radius:calc(var(--r) + 4px)}
.srow.nx{background:var(--surf2)}
.srow .sl{flex:1;min-width:0;color:var(--mut);font-size:13px;overflow-wrap:anywhere}

.ivb{width:100%;margin-top:10px}
/* rest timer bar */
.rest{position:fixed;left:0;right:0;z-index:16;padding:0 calc(env(safe-area-inset-right) + 12px) 8px calc(env(safe-area-inset-left) + 12px)}
.rest-in{position:relative;overflow:hidden;max-width:536px;margin:0 auto;display:flex;align-items:center;gap:6px;background:var(--ink);color:var(--bg);border-radius:var(--r);padding:6px;box-shadow:0 4px 14px rgb(0 0 0 / .22)}
.rest .ibtn{border:1px solid currentColor;font:700 16px/1 var(--fh)}
.rest .btn{background:transparent;color:inherit;border-color:currentColor;padding:0 12px}
.rt{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center}
.rt b{font:700 28px/1 var(--fh);font-variant-numeric:tabular-nums}

.rest.over .rest-in{background:var(--acc);color:var(--on-acc)}

@media (max-width:899px){body.timing main::after{content:"";display:block;height:68px}}

.hiit{position:fixed;inset:0;z-index:40;background:var(--bg);overflow-y:auto;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}

.hrun .btn{background:transparent;color:inherit;border-color:currentColor;min-height:56px;font:700 18px/1 var(--fh);text-transform:uppercase;letter-spacing:.05em}

.wrow{display:flex;gap:8px}

.last{font-size:13px;color:var(--mut);margin-top:6px}
.hint{font-size:14px;margin-top:10px;padding:8px 10px;border-radius:8px;background:var(--surf2)}
.pain-row{display:flex;align-items:center;gap:8px;margin:4px 0 8px}

/* history */
.seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line2);border-radius:var(--r);overflow:hidden;margin:12px 0}
.seg.s3{grid-template-columns:repeat(3,1fr)}
.seg.tv{margin:0 0 12px}
.seg button{min-height:var(--tap);font-weight:600;background:var(--surf)}
.seg button[aria-pressed=true]{background:var(--acc);color:var(--on-acc)}
.wkh{font:600 13px/1 var(--fb);color:var(--mut);text-transform:uppercase;letter-spacing:.07em;margin:18px 2px 8px}
.hs{padding:0 14px}
.hrow{display:flex;align-items:center;gap:12px;width:100%;min-height:60px;text-align:left;padding:8px 0}
.hrow .m{flex:1;min-width:0;display:flex;flex-direction:column}
.hrow b{font:600 18px/1.15 var(--fh)}
.hs{border-left:3px solid var(--c)}
.hd{flex:none;width:56px;display:flex;flex-direction:column;gap:3px;font-size:13px;font-weight:600;line-height:1}
.hd span{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
.hn{display:block;font:500 14px/1.3 var(--fb);color:var(--mut);text-transform:none;letter-spacing:0}

.hbody .exlist{margin-top:0}

.chart{position:relative;margin-top:12px;touch-action:pan-y}

.gl{stroke:var(--line);stroke-width:1}

.tip{position:absolute;transform:translateX(-50%);background:var(--ink);color:var(--bg);font:600 13px/1.25 var(--fb);padding:6px 8px;border-radius:6px;white-space:nowrap;pointer-events:none}
table{width:100%;border-collapse:collapse;font-size:14px;margin-top:8px}
th,td{text-align:left;padding:6px 4px;border-top:1px solid var(--line);overflow-wrap:anywhere}
th{color:var(--mut);font-weight:600}
details.data>summary{min-height:var(--tap);display:flex;align-items:center;cursor:pointer;color:var(--mut);font-size:14px;margin-top:8px}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0 8px}

/* Numbers and micro-labels in monospace, every theme: digits don't shift while timers count. */
.sv,.rt b,.h-t,.pain-v,.prog b,.wk-count b,.stat .v,.h-rd,.day .dn,.mono{font-family:var(--fm);font-variant-numeric:tabular-nums;letter-spacing:0}
.sv{font-size:21px}.rt b{font-size:24px}.pain-v{font-size:28px}.prog b,.wk-count b{font-size:22px}.stat .v{font-size:21px}
.h-t{font-size:min(30vw,38vh);font-weight:600}
.lab,.wkh,.dow,.nl,.ag-h,.legend{font-family:var(--fm);font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase}
.wrow .txt{font-family:var(--fm);font-size:16px}

/* desktop dashboard: three independent columns, no tab bar */
/* Per-set weights, swaps, exercise links */
.shd{display:flex;align-items:center;gap:10px;padding:0 4px 2px 3px;font:600 11.5px/1 var(--fm);text-transform:uppercase;letter-spacing:.06em;color:var(--mut)}

label.wrow{align-items:center;gap:10px;margin-top:4px}label.wrow .sl{flex:1;color:var(--mut);font-size:13px}label.wrow .wv{width:96px;flex:none;text-align:center;font:600 17px/1 var(--fm)}

.sm-b{min-height:38px;padding:0 12px;font-size:14px;margin-top:10px}

.mchips{display:flex;gap:6px;overflow-x:auto;margin:0 -12px 6px;padding:2px 12px 8px;scrollbar-width:none}

.mch[aria-pressed=true]{background:var(--acc);color:var(--on-acc);border-color:var(--acc)}
.dfam{display:flex;align-items:baseline;justify-content:space-between;margin:14px 2px 6px}

.crumb button{color:var(--acc);text-decoration:underline;text-underline-offset:3px;padding:6px 0}
.mus{display:inline-block;padding:5px 11px;border-radius:15px;font-size:14px;margin:0 6px 6px 0;border:1px solid var(--line2)}

.facts{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0;font-size:15px}

.dlinks{display:flex;flex-wrap:wrap;gap:8px}

.pnote{padding:8px 0;border-top:1px solid var(--line);font-size:15px}.pnote:first-of-type{border-top:0;padding-top:0}

@media (min-width:900px){
  .tabs,.dock{display:none!important}

<script>
'use strict';

/* ================= Program — mirrors docs/training-plan.md =================
   Exercise names (n) are the keys in saved history: renaming one breaks the
   chart's continuity for that lift. `cur.done` / `cur.w` are keyed by index,
   so reordering a session's list mid-session misattributes sets. */
const ORDER = ['A', 'B', 'C', 'D'];
const WEEK_START = 1;      // weeks start Monday
const SUGGEST_DAYS = 70;   // ~10 weeks of suggestions
const EXPORT_V = 3;        // backup format. v3 keys ex by exercise id with per-set weights (see recsOf); v2 added ex[name].r; v1 and v2 files still import
const DAY = 864e5;
// [value, name, group]. 'mono' themes share the Terminal look (hairlines, square corners, monospace headings).
const SKINS = [['slate', 'Slate and teal (default)', 'Classic'], ['iron', 'Iron and chalk', 'Classic'], ['hv', 'High-vis (bigger type)', 'Classic'],
  ['term', 'Terminal', 'Terminal'], ['amber', 'Amber CRT', 'Terminal'], ['phos', 'Phosphor', 'Terminal'], ['frost', 'Frost', 'Terminal'], ['ember', 'Ember', 'Terminal'], ['synth', 'Synth', 'Terminal']];

// Inherited fields; everything else (name, desc, next, alt, up, aka) belongs to the exercise itself.
const INHERIT = ['track', 'equip', 'side', 'wt', 'muscles'];
const DEF = new Map();
function exDef(id) {
  if (DEF.has(id)) return DEF.get(id);
  const x = EXERCISES[id]; if (!x) return null;
  const p = x.parent ? exDef(x.parent) : null, d = { id };
  if (p) for (const f of INHERIT) if (p[f] !== undefined) d[f] = p[f];
  Object.assign(d, x);
  if (!d.muscles) d.muscles = mu([]);
  DEF.set(id, d);
  return d;
}
// Family = the top 'pattern' ancestor. Used for grouping in the dictionary and Lift progress.
function family(id) { let d = exDef(id), f = null; while (d) { if (d.kind === 'pattern') f = d; d = d.parent ? exDef(d.parent) : null; } return f; }
const ancestors = id => { const out = []; let d = exDef(id); while (d && d.parent) { d = exDef(d.parent); out.unshift(d); } return out; };

const ALIAS = new Map();
for (const [id, x] of Object.entries(EXERCISES)) if (x.kind !== 'pattern') [x.n, ...(x.aka || [])].forEach(n => ALIAS.set(n, id));

function nextStep(s, i) {
  const ex = SESSIONS[s].ex, c = cur || blank(s), left = j => (c.done[j] || 0) < ex[j].sets, g = group(s, i);
  for (let k = 1; k < g.length; k++) { const j = g[(g.indexOf(i) + k) % g.length]; if (left(j)) return j + 1; }
  if (left(i)) return i + 1;
  for (let j = Math.max(...g) + 1; j < ex.length; j++) if (!ex[j].opt && left(j)) return j + 1;

}
// Steps: 0 = warm-up, 1..N = exercises, N+1 = wrap-up.

  const ex = SESSIONS[s].ex, c = cur;
  if (!c) return 0;
  const any = Object.values(c.done).some(n => n > 0);
  if (!any && warmCount(c) < WARM.length) return 0;
  const i = ex.findIndex((x, j) => !x.opt && (c.done[j] || 0) < x.sets);
  return i < 0 ? ex.length + 1 : i + 1;
}

  if (added && !save('hist', hist)) return;
  render();
  toast(`Imported ${added} new session${added === 1 ? '' : 's'}` + (dup ? `, ${dup} already here` : '') + (bad ? `, ${bad} unreadable` : '') + (data && data.v > EXPORT_V ? ' (file is from a newer version)' : ''));
}

/* ---------- Toast, wake lock ---------- */
let toastT;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2800); }
let wl = null, wlPending = false;
const wantLock = () => H.open || (!S.wide && S.tab === 'train');
async function lockOn() {
  if (!('wakeLock' in navigator) || wl || wlPending || document.visibilityState !== 'visible') return;
  wlPending = true;
  try { wl = await navigator.wakeLock.request('screen'); wl.addEventListener('release', () => { wl = null; }); } catch (e) {}
  wlPending = false;
  if (!wantLock()) lockOff();
}
function lockOff() { if (wl) { wl.release().catch(() => {}); wl = null; } }

/* ================= Events (delegated) ================= */
const ACT = {
  tab(t) { if (S.tab === t.dataset.tab) return; clearTimeout(S.advT); S.tab = t.dataset.tab; render(); scrollTo(0, 0); },
  mon(t) { const d = new Date(S.month.y, S.month.m + +t.dataset.d, 1); S.month = { y: d.getFullYear(), m: d.getMonth() }; render(); },
  today() { const d = new Date(); S.month = { y: d.getFullYear(), m: d.getMonth() }; S.sel = dk(d); render(); },
  day(t) { const d = fromKey(t.dataset.k); S.sel = t.dataset.k; S.month = { y: d.getFullYear(), m: d.getMonth() }; render(); },
  wd(t) {
    const d = +t.dataset.d;
    if (days.includes(d)) { if (days.length === 1) { toast('Keep at least one training day.'); return; } days = days.filter(x => x !== d); }
    else days = [...days, d].sort((a, b) => a - b);
    save('days', days); render();
  },
  mode(t) { prefs.mode = t.dataset.v; savePrefs(); render(); },
  unit(t) {
    const u = t.dataset.v; if (u === prefs.unit || !['lb', 'kg'].includes(u)) return;
    // Weights typed in the session in progress are converted, so 100 lb doesn't become 100 kg.
    if (cur) {
      for (const [i, o] of Object.entries(cur.wv)) {
        const x = SESSIONS[cur.s].ex[i]; if (!x || wkind(x) === 'level') continue;   // levels have no unit
        for (const j in o) if (Number.isFinite(o[j])) o[j] = conv(o[j], prefs.unit, u);
      }
      saveCur();
    }
    prefs.unit = u; savePrefs(); render();
  },
  tview(t) { prefs.tview = t.dataset.v; savePrefs(); S.fi = null; render(); scrollTo(0, 0); },
  start() {
    if (!cur) { cur = blank(nextSession()); saveCur(); }
    S.preview = null; S.warmOpen = null; S.fi = null; S.tab = 'train'; render(); scrollTo(0, 0);
    if (S.wide) $('#app .col:nth-child(2)').scrollTop = 0;
  },
  chip(t) {
    const s = t.dataset.s; if (s === trainS()) return;
    if (cur) {
      if (hasProgress(cur) && !confirm(`Switch to Session ${s}? Sets and weights logged for Session ${cur.s} will be discarded.`)) return;
      const warm = { ...cur.warm }; delete warm.focus;    // shared warm-up blocks carry over; the focus block is per session
      cur = { ...blank(s), warm }; saveCur();
    } else S.preview = s;
    S.fi = null; render();
  },
  set(t) {
    const i = +t.dataset.i, j = +t.dataset.j, c = ensureCur(), prev = c.done[i] || 0;
    const n = prev === j + 1 ? j : j + 1;              // tapping the last ticked set unticks it
    if (n) c.done[i] = n; else delete c.done[i];
    saveCur(); updateCard(i);
    n > prev ? startRest(c.s, i) : stopRest();
  },
  rep(t) {
    const s = trainS(), i = +t.dataset.i, j = +t.dataset.j, x = SESSIONS[s].ex[i], m = measure(x); if (!m) return;
    const v = Math.max(0, repVal(s, i, j, lastFor(effId(s, i))) + +t.dataset.d * m.step), c = ensureCur();
    (c.reps[i] || (c.reps[i] = {}))[j] = v; saveCur();
    const o = $(`#rv${i}-${j}`); if (o) o.textContent = v;
    if (inFocus()) renderDock();
  },
  restadj(t) {
    if (!R.end) return;
    const d = +t.dataset.d * 1000;
    if (R.over) { R.over = 0; R.end = Date.now() + Math.max(15000, d); R.total = R.end - Date.now(); R.beeped = 0; }
    else { R.end = Math.max(Date.now(), R.end + d); R.total = Math.max(1000, R.total + d); }
    tickRest();
  },
  restskip() { stopRest(); },
  prest(t) { const f = t.dataset.f; prefs[f] = clamp(prefs[f] + +t.dataset.d, 15, 600); savePrefs(); render(); },
  ivopen(t) {
    if (H.on) return;
    if (t.dataset.i != null) {
      const s = trainS(), i = +t.dataset.i, x = SESSIONS[s].ex[i], iv = x.iv; let n = x.sets;
      if (iv.log === 'rounds') { const last = lastFor(effId(s, i)); n = repVal(s, i, 0, last); }
      ivOpen({ w: iv.w, r: iv.r, n }, { s, i, log: iv.log }, null);
    } else {
      const p = t.dataset.p;
      ivOpen(p === 'last' && prefs.iv ? prefs.iv : IV_PRESETS[p][1], null, p === 'last' ? null : p);
    }
  },
  hpre(t) { H.cfg = { ...H.cfg, ...IV_PRESETS[t.dataset.p][1] }; H.preset = t.dataset.p; hDraw(); },
  hcfg(t) {
    const f = t.dataset.f, d = +t.dataset.d, c = H.cfg; let v = c[f];
    if (f === 'n') v = clamp(v + d, 1, 50);
    else { const st = f === 'prep' ? 5 : (d > 0 ? v < 60 : v <= 60) ? 5 : 15; v = clamp(v + d * st, 0, f === 'prep' ? 60 : 900); }
    c[f] = v; H.preset = null; hDraw();
  },
  hstart() { hStart(); },
  hpause() { hPause(); },
  hskip() { if (H.on) { if (H.paused) hPause(); hAdvance(Date.now(), true); } },
  hround() { if (H.on) hAdvance(Date.now(), true); },
  hend() {
    if (!H.on) return;
    if (H.done < H.cfg.n && !confirm(`End intervals? ${H.done} of ${H.cfg.n} rounds done.`)) return;
    if (H.paused) hPause();
    hFinish(false);
  },
  hagain() { H.fin = false; hStart(); },
  hclose() { hClose(); },
  fnav(t) { goStep((S.fi ?? 0) + +t.dataset.d); },
  fgo() {
    const s = trainS(), N = SESSIONS[s].ex.length, st = S.fi ?? resumeStep(s);
    clearTimeout(S.advT);
    if (st === 0) { const i = SESSIONS[s].ex.findIndex((x, j) => !x.opt && ((cur && cur.done[j]) || 0) < x.sets); goStep(i < 0 ? N + 1 : i + 1); return; }
    if (st === N + 1) { ACT.finish(); return; }
    const i = st - 1, x = SESSIONS[s].ex[i], c = ensureCur(), n = c.done[i] || 0;
    if (n >= x.sets) { goStep(nextStep(s, i)); return; }
    c.done[i] = n + 1; saveCur(); updateCard(i); startRest(s, i);
    const nx = nextStep(s, i);
    if (nx !== st) S.advT = setTimeout(() => goStep(nx), 450);   // brief pause so the tick registers
  },
  fundo() {
    if (!cur || !S.fi) return;
    clearTimeout(S.advT);
    const i = S.fi - 1, n = cur.done[i] || 0; if (!n) return;
    if (n > 1) cur.done[i] = n - 1; else delete cur.done[i];
    saveCur(); updateCard(i); stopRest();
  },
  pain(t) { setPain(((cur && cur.pain) || 0) + +t.dataset.d); },
  finish() {
    if (!cur || !hasProgress(cur)) { toast('Tick at least one set before finishing.'); return; }
    if (!confirm(`Finish and log Session ${cur.s}?`)) return;
    const ex = {};
    SESSIONS[cur.s].ex.forEach((x, i) => {
      const r = curRec(cur.s, i); if (!r) return;
      const id = effId(cur.s, i), o = ex[id];
      if (!o) { ex[id] = r; return; }
      // The same exercise in two slots (only possible through a swap): merge the sets.
      o.n += r.n; if (r.r) o.r = [...(o.r || []), ...r.r]; if (r.w) o.w = [...(o.w || Array(o.n - r.n).fill(null)), ...r.w];
    });
    const entry = { d: Date.now(), s: cur.s, v: 3, pain: cur.pain | 0, loc: String(cur.loc || '').trim(), ex };
    hist.unshift(entry);
    if (!save('hist', hist)) { hist.shift(); return; }   // keep the in-progress session if the write failed
    cur = null; saveCur(); stopRest();
    const d = new Date(); S.tab = 'home'; S.month = { y: d.getFullYear(), m: d.getMonth() }; S.sel = dk(d); S.preview = null; S.warmOpen = null; S.fi = null;
    render(); scrollTo(0, 0); toast(`Session ${entry.s} logged`);
  },
  discard() {
    if (!cur || (hasProgress(cur) && !confirm('Discard this session? Ticked sets and weights will be lost.'))) return;
    cur = null; saveCur(); stopRest(); S.preview = null; S.warmOpen = null; S.fi = null; render(); scrollTo(0, 0);
  },
  hv(t) { S.hv = t.dataset.v; render(); },
  hopen(t) {
    const id = t.dataset.id, open = !S.open.has(id);
    open ? S.open.add(id) : S.open.delete(id);
    t.setAttribute('aria-expanded', open); document.getElementById('hd-' + id).hidden = !open;
  },
  hdel(t) {
    const e = hist.find(x => eid(x) === t.dataset.id); if (!e) return;
    if (!confirm(`Delete Session ${e.s} from ${fMed(e.d)}? This can’t be undone.`)) return;
    hist = hist.filter(x => x !== e); save('hist', hist); render(); toast('Session deleted');
  },
  export() { exportData(); },
  dict(t) { dOpen(t.dataset.id); },
  dback() { dBack(); },
  dmus(t) { DX.mus = t.dataset.m || null; dDraw(); },
  import() { $('#importFile').click(); },
};
const INP = {
  // Weight boxes patch in place (no re-render) so the keyboard stays up; later sets that still carry
  // a default follow the value typed here.
  wv(t) {
    const raw = t.value.replace(',', '.').trim(), v = raw === '' ? null : parseFloat(raw);
    if (raw !== '' && !Number.isFinite(v)) return;
    const c = ensureCur(), s = c.s, i = +t.dataset.i, j = +t.dataset.j;
    (c.wv[i] || (c.wv[i] = {}))[j] = v; saveCur();
    t.classList.remove('dflt');
    const last = lastFor(effId(s, i));
    document.querySelectorAll(`input[data-inp="wv"][data-i="${i}"]`).forEach(el => {
      const k = +el.dataset.j; if (el === t || hasW(s, i, k)) return;
      const d = wVal(s, i, k, last); el.value = d == null ? '' : fnum(d);
    });
    if (inFocus()) renderDock();
  },
  loc(t) { ensureCur().loc = t.value; saveCur(); },
  pain(t) { setPain(+t.value); },
};
document.addEventListener('click', e => { const t = e.target.closest('[data-act]'); if (t && !t.disabled && ACT[t.dataset.act]) ACT[t.dataset.act](t, e); });
document.addEventListener('input', e => { const t = e.target; if (t.dataset && INP[t.dataset.inp]) INP[t.dataset.inp](t); });
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.inp === 'warm') {
    const c = ensureCur(), i = t.dataset.i; if (t.checked) c.warm[i] = true; else delete c.warm[i]; saveCur();
    const wc = $('#wcount'); if (wc) wc.textContent = warmCount(c);
  } else if (t.dataset.inp === 'fhv') { prefs.focusHv = t.checked; savePrefs(); applyTheme(); }
  else if (t.dataset.inp === 'restAuto' || t.dataset.inp === 'sound') { prefs[t.dataset.inp] = t.checked; savePrefs(); if (t.dataset.inp === 'restAuto' && !t.checked) stopRest(); else unlockAudio(); }
  else if (t.dataset.inp === 'lift') { S.lift = t.value; render(); }
  else if (t.dataset.inp === 'swap') {
    const c = ensureCur(), i = +t.dataset.i, x = SESSIONS[c.s].ex[i];
    if (!swapOpts(x).includes(t.value)) return;
    if (t.value === x.id) delete c.sw[i]; else c.sw[i] = t.value;
    saveCur(); render();
  }
  else if (t.dataset.inp === 'skin') { if (SKINS.some(([v]) => v === t.value)) { prefs.skin = t.value; savePrefs(); render(); } }
  else if (t.id === 'importFile' && t.files[0]) {
    const f = t.files[0]; t.value = '';
    f.text().then(txt => { let data; try { data = JSON.parse(txt); } catch (err) { toast('That file isn’t valid JSON.'); return; } importData(data); })
      .catch(() => toast('Couldn’t read that file.'));
  }
});
document.addEventListener('keydown', e => {
  unlockAudio();
  const t = e.target, typing = /^(INPUT|SELECT|TEXTAREA)$/.test(t.tagName);
  if (e.key === 'Enter' && t.classList && t.classList.contains('txt')) { t.blur(); return; }
  if (DX.open) { if (e.key === 'Escape') dBack(); return; }
  if (H.open) {
    if (e.key === 'Escape' && !H.on) { hClose(); return; }
    if (e.key === ' ' && H.on && t.tagName !== 'BUTTON') { e.preventDefault(); H.ph[H.idx].d ? hPause() : hAdvance(Date.now(), true); }
    return;
  }
  if (!inFocus() || typing || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === 'ArrowRight') goStep((S.fi ?? 0) + 1);
  else if (e.key === 'ArrowLeft') goStep((S.fi ?? 0) - 1);
  else if (e.key === ' ' && t.tagName !== 'BUTTON') { e.preventDefault(); ACT.fgo(); }
});
document.addEventListener('toggle', e => { if (e.target.classList && e.target.classList.contains('warm')) S.warmOpen = e.target.open; }, true);
// Horizontal swipe between focus-mode steps (vertical scrolling stays native via touch-action: pan-y).
let swipe = null;
document.addEventListener('pointerdown', e => {
  unlockAudio(); chartPointer(e);
  const area = e.target.closest && e.target.closest('[data-swipe]');
  swipe = area && !e.target.closest('input,select,textarea') ? { x: e.clientX, y: e.clientY } : null;
});
document.addEventListener('pointerup', e => {
  if (!swipe) return;
  const dx = e.clientX - swipe.x, dy = e.clientY - swipe.y; swipe = null;
  if (Math.abs(dx) > 70 && Math.abs(dx) > 2 * Math.abs(dy)) goStep((S.fi ?? 0) + (dx < 0 ? 1 : -1));
});
document.addEventListener('pointercancel', () => { swipe = null; });
document.addEventListener('pointermove', chartPointer);
document.addEventListener('pointerout', e => {
  const svg = e.pointerType === 'mouse' && e.target.closest && e.target.closest('svg[data-chart]');
  if (svg && !(e.relatedTarget && svg.contains(e.relatedTarget))) chartHide(svg);
});
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;
  if (wantLock()) lockOn();
  tickRest(); hTick();
  const k = dk(new Date());
  if (k !== S.today && S.tab !== 'train') { if (S.sel === S.today) S.sel = k; S.today = k; render(); }  // app left open past midnight
});
MQ.addEventListener('change', () => { S.wide = MQ.matches; render(); drawRest(); });
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme);
let rzT; addEventListener('resize', () => {
  clearTimeout(rzT);
  rzT = setTimeout(() => { const a = document.activeElement; if (S.hv === 'lifts' && (S.wide || S.tab === 'history') && !(a && /^(INPUT|SELECT)$/.test(a.tagName))) render(); }, 200);
});

/* ================= Boot ================= */
render();
if (navigator.storage && navigator.storage.persist) navigator.storage.persisted().then(p => p || navigator.storage.persist()).catch(() => {});
if ('serviceWorker' in navigator) {
  // Append ?nosw while iterating locally to drop the service worker and its caching.
  if (/[?&]nosw\b/.test(location.search)) navigator.serviceWorker.getRegistrations().then(rs => rs.forEach(r => r.unregister()));
  else addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
